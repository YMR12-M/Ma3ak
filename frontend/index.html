<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=3" />
  <meta name="theme-color" content="#2f7d6e" />
  <title>معاك | MA3ak</title>

  <!-- PWA: بيسمح للمتصفح (خصوصًا أندرويد/كروم) إنه يعتبر الموقع تطبيق قابل للتثبيت -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />

  <!-- iOS مالوش دعم لـ manifest.json ولا لرسالة تثبيت تلقائية - الوسوم دي بس بتظبط
       شكل الأيقونة/الشريط لما حد يضيفه يدويًا من قايمة المشاركة (Safari → مشاركة →
       إضافة إلى الشاشة الرئيسية). التفاصيل والقيود موثقة في js/components/Common.jsx -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- المعيار الحديث اللي بقى بديل الوسم اللي فوقه (اللي فوق فاضل عشان نسخ iOS الأقدم) -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="معاك" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- الـ CSS مقسّم لطبقات، والترتيب ده مقصود (كل طبقة بتبني على اللي قبلها):
       tokens (قيم التصميم) ← base (إعادة ضبط المتصفح) ← animations (الحركة)
       ← components (عناصر مشتركة) ← layout/auth/screens/patient (شاشات).
       وسوم <link> منفصلة مش @import: المتصفح بيحمّلهم بالتوازي، بينما @import
       بيحمّلهم واحد ورا التاني وبيأخّر أول رسم للصفحة. -->
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/animations.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="stylesheet" href="/css/screens.css" />
  <link rel="stylesheet" href="/css/patient.css" />
</head>
<body>
  <div id="root"></div>

  <!-- React (بدون أي build tool - CDN مباشرة) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone: بيترجم JSX جوه المتصفح مباشرة -->
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

  <!-- كل مسارات السكريبتات لازم تبقى مطلقة (تبدأ بـ /) عشان تشتغل صح لما الصفحة
       تتفتح من مسار تاني غير الجذر، زي /access/<token> بتاع لينك دخول المريض -->

  <!-- JS عادي (مش JSX) -->
  <script src="/js/api.js"></script>
  <script src="/js/doseLogic.js"></script>

  <!-- مكونات React (ملفات .jsx فعلية، بيترجمها Babel live جوه المتصفح) -->
  <script type="text/babel" data-presets="react" src="/js/components/Common.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/components/Settings.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/components/Auth.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/components/Layout.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/components/Dashboard.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/components/Medications.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/components/Appointments.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/components/Vitals.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/components/Notifications.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/components/Patients.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/components/PatientHome.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/app.jsx"></script>

  <!-- تسجيل الـ Service Worker - شرط أساسي عشان كروم/أندرويد يعتبروا الموقع "قابل للتثبيت".
       لو فشل التسجيل لأي سبب (متصفح قديم، إلخ) التطبيق يفضل شغال عادي من غيره. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
