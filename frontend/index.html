<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=3" />
  <meta name="theme-color" content="#2f7d6e" />
  <!-- بيقول للمتصفح إن الصفحة بتدعم الوضعين، فعناصره هو (شريط السكرول، حقول
       الإدخال الافتراضية) بتتلوّن صح بدل ما تفضل فاتحة فوق تصميم داكن -->
  <meta name="color-scheme" content="light dark" />
  <title>معاك | MA3ak</title>
  <!-- الوصف ده هو اللي بيظهر تحت اسم الموقع في نتايج البحث ولما اللينك يتبعت
       على واتساب - من غيره المتصفحات ومحركات البحث بتقص أول كلام في الصفحة -->
  <meta
    name="description"
    content="معاك - تطبيق بيساعد كبار السن ومتابعينهم على مواعيد الدوا والكشوفات. المتابع بيجهّز كل حاجة من موبايله، والمريض بيفتح شاشة واحدة بسيطة فيها جرعة واحدة بس كل مرة."
  />

  <!-- PWA: بيسمح للمتصفح (خصوصًا أندرويد/كروم) إنه يعتبر الموقع تطبيق قابل للتثبيت -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />

  <!-- iOS مالوش دعم لـ manifest.json ولا لرسالة تثبيت تلقائية - الوسوم دي بس بتظبط
       شكل الأيقونة/الشريط لما حد يضيفه يدويًا من قايمة المشاركة (Safari → مشاركة →
       إضافة إلى الشاشة الرئيسية). التفاصيل والقيود موثقة في js/components/Common.jsx -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- المعيار الحديث اللي بقى بديل الوسم اللي فوقه (اللي فوق فاضل عشان نسخ iOS الأقدم) -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="معاك" />

  <!-- الخطوط مستضافة عندنا (frontend/fonts/) مش من Google Fonts - السبب الكامل
       في css/fonts.css. الملف العربي بيتحمّل قبل الـ CSS ما يتقري أصلاً: هو خط
       كل النص في التطبيق تقريبًا، فتأخيره لحد ما المتصفح يلاقي @font-face
       معناه إن المستخدم يشوف الصفحة بخط النظام الأول وبعدين تتبدّل قدامه.
       crossorigin مطلوب حتى للملفات اللي من نفس السيرفر: طلبات الخطوط بتتبعت
       في وضع CORS دايمًا، ومن غير الكلمة دي المتصفح بينزّل الملف مرتين. -->
  <link rel="preload" href="/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin />

  <!-- ملف CSS واحد مبني من طبقات css/ العشرة (tokens ← base ← animations ←
       materials ← components ← modal ← layout ← auth ← screens ← patient).
       الطبقات موجودة زي ما هي في المصدر - الدمج بيحصل في وقت البناء بس، عشان
       المتصفح يفتح طلب واحد بدل عشرة. الترتيب مصدره frontend/build.js. -->
  <link rel="stylesheet" href="/dist/app.css" />

  <!-- سكريبتات التطبيق. defer معناها: نزّلهم دلوقتي بالتوازي مع كل حاجة تانية،
       وشغّلهم بعد ما الـ HTML يخلص - بالترتيب اللي مكتوبين بيه.
       vendor.js فيه React + ReactDOM مستضافين عندنا، وapp.js فيه كل ملفات js/
       متُرجمة ومدموجة. مفيش Babel في المتصفح خالص - التفاصيل في frontend/build.js. -->
  <script defer src="/dist/vendor.js"></script>
  <script defer src="/dist/app.js"></script>

  <!-- المظهر لازم يتحدد قبل أول رسم، مش من جوه React.
       من غير السطرين دول، المستخدم اللي مختار الوضع الداكن كان بيشوف ومضة بيضا
       في الأول لحد ما الجافاسكريبت يحمّل ويشتغل - الومضة دي بالذات مؤذية للعين
       في تطبيق ناس بتفتحه بالليل عشان مواعيد الدوا.
       المفاتيح دي نفسها اللي بيستخدمها app.jsx (ma3ak_dark / ma3ak_font_large). -->
  <script>
    try {
      var d = localStorage.getItem('ma3ak_dark');
      var dark = d === null ? matchMedia('(prefers-color-scheme: dark)').matches : d === '1';
      var root = document.documentElement;
      root.setAttribute('data-theme', dark ? 'dark' : 'light');
      root.setAttribute('data-font', localStorage.getItem('ma3ak_font_large') === '1' ? 'large' : 'normal');
    } catch (e) {
      /* متصفح قافل التخزين المحلي (تصفّح خاص في بعض الأجهزة) - يفضل على الفاتح */
    }
  </script>

</head>
<body>
  <!-- شاشة الإقلاع مكتوبة في الـ HTML نفسه، مش مستنية React.
       React بيمسح المحتوى ده ويحط مكانه نفس الشاشة بالظبط أول ما يشتغل، فمفيش
       أي قفزة بصرية - المستخدم بيشوف شاشة واحدة متصلة من أول جزء من الثانية.
       مسار الأيقونة نسخة من أيقونة brand في js/icons.jsx. -->
  <div id="root">
    <div class="boot-screen">
      <div class="boot-logo" aria-hidden="true">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20.8 4.4 13.3a5 5 0 1 1 7.6-6.4 5 5 0 1 1 7.6 6.4Z" />
          <path d="M4.6 12.4h3.1l1.6-3 2.2 5.6 1.7-3.3 1 .7h5.2" />
        </svg>
      </div>
      <div class="boot-name">معاك</div>
    </div>
  </div>

  <!-- تسجيل الـ Service Worker - شرط أساسي عشان كروم/أندرويد يعتبروا الموقع "قابل للتثبيت".
       لو فشل التسجيل لأي سبب (متصفح قديم، إلخ) التطبيق يفضل شغال عادي من غيره. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
