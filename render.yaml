# Render Blueprint - بيوصف السيرفر المطلوب لـ Render عشان ينشره بضغطة واحدة
# (Dashboard → New → Blueprint → اختار الريبو ده). التفاصيل الكاملة في docs/DEPLOY.md.
#
# ملحوظة مهمة: Render مبيوفرش MySQL كخدمة مُدارة (Postgres/Redis بس) - قاعدة
# البيانات لازم تكون خارجية (شوف docs/DEPLOY.md). عشان كده متغيرات DB_* هنا
# sync: false - يعني Render هيسألك تدخلها بنفسك من الداشبورد بعد ما تجهّز القاعدة.
services:
  - type: web
    name: ma3ak
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    # --include=dev مهم: Render بيشغّل البناء وNODE_ENV=production، وفي الوضع
    # ده npm بيتخطى devDependencies - يعني esbuild (أداة بناء الواجهة) مكانش
    # هيتسطّب والبناء كان هيفشل.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: JWT_SECRET
        generateValue: true # Render بيولّد قيمة عشوائية طويلة وآمنة لوحده
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      # مفاتيح الـ Web Push. من غيرها التطبيق بيشتغل عادي، بس التذكير مش هيوصل
      # لحد والتطبيق مقفول - يعني الميزة الأساسية معطّلة.
      # ولّدهم مرة واحدة بـ: npx web-push generate-vapid-keys
      # sync: false يعني Render هيسألك تدخلهم بنفسك (المفتاح الخاص سر).
      # ⚠️ متغيّرهمش بعد النشر - كل الاشتراكات القديمة بتبطل وكل مستخدم
      #    هيحتاج يفعّل التنبيهات من الأول.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
